plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.wangyao.hwcodeclib'
    compileSdk 34

    defaultConfig {
        minSdk 28

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        // 其余 7 个 native 模块都锁在 armeabi-v7a + arm64-v8a，只有这里是注释掉的，
        // 于是 merged_native_libs 里 x86 / x86_64 两个目录只躺着 libhwcodec.so：
        // APK 在 x86 设备/模拟器上能装能起，但除硬件编解码页以外全部功能因为
        // 找不到 .so 而 loadLibrary 失败。跟上其余模块的 ABI 口径。
        ndk{
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}